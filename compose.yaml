services:
  mysql:
    image: mysql:8.4
    container_name: ai-health-companion-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ai_health_companion}
      MYSQL_USER: ${MYSQL_USER:-healthapp}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-this-local-password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-this-root-password}
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: ai-health-companion-ai
    restart: unless-stopped
    environment:
      AI_MODE: production
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-google/gemini-2.5-flash}
    ports:
      - "${AI_HOST_PORT:-8001}:8000"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: "1"
    container_name: ai-health-companion-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      ai-service:
        condition: service_started
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-ai_health_companion}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: ${MYSQL_USER:-healthapp}
      DB_PASSWORD: ${MYSQL_PASSWORD:-change-this-local-password}
      AI_MODE: production
      AI_PROVIDER_BASE_URL: http://ai-service:8000
      JWT_SECRET: ${JWT_SECRET:-development-health-app-super-secret-key-32-bytes-long-12345}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}
    ports:
      - "${BACKEND_HOST_PORT:-8081}:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-health-companion-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:80"

volumes:
  mysql-data:
