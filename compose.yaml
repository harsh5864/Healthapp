services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-health-companion-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_health_companion}
      POSTGRES_USER: ${POSTGRES_USER:-healthapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-local-password}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: ai-health-companion-ai
    restart: unless-stopped
    environment:
      AI_MODE: production
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-google/gemini-2.5-flash}
    ports:
      - "${AI_HOST_PORT:-8001}:8000"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: "1"
    container_name: ai-health-companion-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ai_health_companion}
      DB_USERNAME: ${POSTGRES_USER:-healthapp}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change-this-local-password}
      AI_MODE: production
      AI_PROVIDER_BASE_URL: http://ai-service:8000
      JWT_SECRET: ${JWT_SECRET:-development-health-app-super-secret-key-32-bytes-long-12345}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}
    ports:
      - "${BACKEND_HOST_PORT:-8081}:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-health-companion-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:80"

volumes:
  postgres-data:
