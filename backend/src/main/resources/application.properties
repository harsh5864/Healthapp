spring.application.name=ai-health-companion-api
server.port=${SERVER_PORT:8080}

# MySQL is the production/local datastore. Docker Compose provides matching defaults.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/ai_health_companion?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:healthapp}
spring.datasource.password=${DB_PASSWORD:change-this-local-password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true

# Spring will enforce this image limit when the Food Scanner is introduced in Phase 4.
spring.servlet.multipart.max-file-size=${MAX_IMAGE_SIZE:8MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:8MB}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}
app.ai.mode=${AI_MODE:mock}
app.ai.provider-base-url=${AI_PROVIDER_BASE_URL:http://localhost:8000}
app.upload.max-image-bytes=${MAX_IMAGE_BYTES:8388608}
