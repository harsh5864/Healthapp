spring.application.name=ai-health-companion-api
server.port=${PORT:${SERVER_PORT:8080}}

# PostgreSQL is the default datastore for deployment (Render, Supabase, Neon, Railway) and Docker Compose.
# Supports both jdbc:postgresql:// and jdbc:mysql:// JDBC URLs.
spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ai_health_companion}}
spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:healthapp}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:change-this-local-password}}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true

# Spring will enforce this image limit when the Food Scanner is introduced in Phase 4.
spring.servlet.multipart.max-file-size=${MAX_IMAGE_SIZE:8MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:8MB}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}
app.ai.mode=${AI_MODE:mock}
app.ai.provider-base-url=${AI_PROVIDER_BASE_URL:http://localhost:8000}
app.upload.max-image-bytes=${MAX_IMAGE_BYTES:8388608}
