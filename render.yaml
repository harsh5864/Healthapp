# Render Blueprint Specification for AI Health Companion
# Deploys: PostgreSQL Database + Python AI Service + Spring Boot API + React Vite Frontend

databases:
  - name: ai-health-db
    databaseName: ai_health_companion
    user: healthapp
    plan: free

services:
  # 1. Python AI Service (FastAPI)
  - type: web
    name: ai-health-companion-ai
    env: python
    rootDir: ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: AI_MODE
        value: production
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: google/gemini-2.5-flash

  # 2. Java Spring Boot Backend (Docker)
  - type: web
    name: ai-health-companion-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    envVars:
      - key: AI_MODE
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ai-health-db
          property: connectionString
      - key: AI_PROVIDER_BASE_URL
        fromService:
          type: web
          name: ai-health-companion-ai
          property: host
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: "*"

  # 3. Frontend (React / Vite Static Site)
  - type: web
    name: ai-health-companion-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: ai-health-companion-backend
          property: host
